<!DOCTYPE html>
<html>
<head>
  <title>TaskFlow</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>TaskFlow Board</h1>

  <div class="board">
    <div class="column">
      <h2>To Do</h2>
      <div id="todo"></div>
      <input id="taskInput" placeholder="New Task">
      <button onclick="addTask()">Add</button>
    </div>

    <div class="column">
      <h2>Completed</h2>
      <div id="completed"></div>
    </div>

    <div class="column">
      <h2>Archived</h2>
      <div id="archived"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
